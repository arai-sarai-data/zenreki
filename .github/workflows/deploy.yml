name: 公開

# main が更新されたとき、または毎月のランキングが終わったときに、
# 場所ごとのプレビュー画像（p/）を作ってから GitHub Pages に公開する。
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["毎月の前歴ランキング"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: プレビュー画像を前回から使い回す
        id: c
        uses: actions/cache@v4
        with:
          path: _site/p
          key: og-${{ hashFiles('rankings/*.json', 'tools/og.mjs') }}
      - uses: actions/setup-node@v4
        if: steps.c.outputs.cache-hit != 'true'
        with:
          node-version: "22"
      - name: 日本語フォントと画像の道具
        if: steps.c.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          npm install --no-save --no-package-lock @napi-rs/canvas@0.1
      - name: プレビュー画像を作る
        if: steps.c.outputs.cache-hit != 'true'
        run: node tools/og.mjs _site/
      - name: サイトを組み立てる
        run: |
          mkdir -p _site
          cp index.html og.png _site/
          if [ -d rankings ]; then cp -r rankings _site/; fi
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
